<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Gestor Essenza</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">
    <h1 class="text-3xl font-bold mb-6">Painel Administrativo</h1>
    <div class="bg-white p-6 rounded shadow mb-8">
        <form id="form-produto" onsubmit="adicionarProduto(event)" class="grid grid-cols-2 gap-4">
            <input type="text" id="nome" placeholder="Nome" required class="border p-2">
            <input type="text" id="categoria" placeholder="Categoria" required class="border p-2">
            <input type="number" step="0.01" id="preco" placeholder="Preço" required class="border p-2">
            <input type="text" id="imagem" placeholder="Nome do arquivo (ex: 1.jpg)" required class="border p-2">
            <textarea id="descricao" placeholder="Descrição" class="col-span-2 border p-2"></textarea>
            <button class="bg-[#CBA25B] p-2 col-span-2 font-bold">CADASTRAR NA NUVEM</button>
        </form>
    </div>
    <table class="w-full bg-white shadow">
        <tbody id="tabela-produtos"></tbody>
    </table>

    <script>
        const API_URL = 'https://6a8370cfcb486d243403b23a.mockapi.io/produtos';

        async function carregarTabela() {
            const res = await fetch(API_URL);
            const data = await res.json();
            document.getElementById('tabela-produtos').innerHTML = data.map(p => `
                <tr class="border-b">
                    <td class="p-4">${p.nome}</td>
                    <td class="p-4">R$ ${p.preco}</td>
                    <td class="p-4"><button onclick="excluir('${p.id}')" class="text-red-500">Excluir</button></td>
                </tr>
            `).join('');
        }

        async function adicionarProduto(e) {
            e.preventDefault();
            const p = {
                nome: document.getElementById('nome').value,
                categoria: document.getElementById('categoria').value,
                preco: document.getElementById('preco').value,
                desc: document.getElementById('descricao').value,
                imgs: [document.getElementById('imagem').value]
            };
            await fetch(API_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(p) });
            carregarTabela();
        }

        async function excluir(id) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            carregarTabela();
        }

        carregarTabela();
    </script>
</body>
</html>
